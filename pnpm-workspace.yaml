# Transitive dependencies pinned past published security advisories. Each entry is
# a package our direct dependencies pull in at a vulnerable range and cannot bump
# themselves yet; drop an entry once the parent ships a fixed range of its own.
overrides:
  # Reached at runtime through @vercel/blob (server/api/image, server/api/upload).
  undici@^6: ^6.29.1
  zod@^4: ^4.6.6

  # Build-time toolchain only — absent from .output/. Audit hygiene, not exposure.
  brace-expansion@^2: ^2.1.7
  brace-expansion@^5: ^5.0.12
  browserslist: ^4.28.7
  tar: ^7.5.21
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  serialize-javascript: ^7.1.3
  shell-quote: ^1.11.0
  nanoid@^3: ^3.3.18
  baseline-browser-mapping: ^2.11.0
